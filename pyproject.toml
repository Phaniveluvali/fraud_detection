[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "invoice-guard"
dynamic = ["version"]
description = "Layered tamper detection for invoices and financial documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "Pillow>=10.3",
    "pikepdf>=9.0",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "joblib>=1.3",
    "scikit-learn==1.7.*",  # must match the version that trained assets/digit_model.joblib
]

[project.optional-dependencies]
# PP-OCR models, Apache-2.0, CPU only. Needed to read scans, photos and screenshots.
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = [
    "pytest>=8.0,<9.2",  # 9.2.0 crashes at start-up with an internal NodeId error
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
invoice-guard = "invoice_guard.cli:main"

[tool.hatch.version]
path = "src/invoice_guard/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:invoice_guard.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "N", "S"]
ignore = ["S101"]  # asserts are fine in tests; production code does not rely on them

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy", "numpy.typing.mypy_plugin"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "pdfplumber.*", "pypdfium2.*", "scipy.*", "rapidocr_onnxruntime.*", "pikepdf.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["invoice_guard"]
branch = true
